<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Racha Fácil</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Racha Fácil</h1>

            <input
                type="text"
                id="descricao"
                placeholder="Descrição da despesa"
            >

            <input
                type="number"
                id="valor"
                placeholder="Valor total"
            >

            <input
                type="text"
                id="pagador"
                placeholder="Quem pagou"
            >

            <input
                type="text"
                id="participantes"
                placeholder="Participantes separados por vírgula"
            >

            <button onclick="adicionarDespesa()">
                Adicionar Despesa
            </button>

            <button onclick="mostrarSaldos()">
                Ver Saldos
            </button>

            <div id="resultado"></div>

            <div class="historico-topo">

                <h2>Histórico</h2>

                <button id="btnLimparHistorico">
                    Limpar Histórico
                </button>

            </div>

            <div id="historico"></div>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
