<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Racha Fácil</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>Racha Fácil</h1>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Digite seu email"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p class="link">
            Não possui conta?
            <a href="cadastro.html">Criar cadastro</a>
        </p>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
