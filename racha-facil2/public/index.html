<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Racha Fácil</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #00c9ff, #92fe9d);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      width: 350px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      text-align: center;
      animation: aparecer 0.6s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      margin-bottom: 20px;
      color: #2c3e50;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #00c9ff;
      box-shadow: 0 0 8px rgba(0, 201, 255, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
      position: relative;
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    button:active {
      transform: scale(0.97);
    }

    button.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    #resultado {
      margin-top: 20px;
      text-align: left;
      background: #f4f6f5;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
      white-space: pre-line;
      opacity: 0;
      transform: translateY(10px);
      transition: 0.4s;
    }

    #resultado.show {
      opacity: 1;
      transform: translateY(0);
    }

    .info {
      font-size: 12px;
      color: #777;
      margin-top: -5px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Racha Fácil</h1>

    <input id="valor" type="number" placeholder="Valor total (R$)">
    
    <input id="pessoas" type="text" placeholder="Ex: João, Maria, Pedro">
    <div class="info">Separe os nomes por vírgula</div>

    <button id="btn" onclick="dividir()">Dividir Conta</button>

    <div id="resultado"></div>
  </div>

  <script>
    async function dividir() {
      const botao = document.getElementById('btn');
      const resultadoDiv = document.getElementById('resultado');

      const valor = parseFloat(document.getElementById('valor').value);

      const pessoas = document
        .getElementById('pessoas')
        .value
        .split(',')
        .map(p => p.trim())
        .filter(p => p !== "");

      if (!valor || pessoas.length === 0) {
        alert("Preencha corretamente os campos!");
        return;
      }

      // Loading no botão
      botao.classList.add("loading");
      botao.innerText = "Calculando...";

      try {
        const res = await fetch('/conta', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ valor, pessoas })
        });

        const data = await res.json();

        let resultadoFormatado = "";

        data.forEach(pessoa => {
          resultadoFormatado += `${pessoa.nome} deve R$ ${pessoa.deve.toFixed(2)}\n`;
        });

        resultadoDiv.innerText = resultadoFormatado;
        resultadoDiv.classList.add("show");

      } catch (erro) {
        alert("Erro ao calcular!");
      }

      // Reset botão
      botao.classList.remove("loading");
      botao.innerText = "Dividir Conta";
    }
  </script>

</body>
</html>
